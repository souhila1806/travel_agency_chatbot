services:
  travel-agent:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LLM_PROVIDER: groq
      GROQ_MODEL: openai/gpt-oss-120b
      LANGSMITH_TRACING: true
      LANGSMITH_PROJECT: travel-planner